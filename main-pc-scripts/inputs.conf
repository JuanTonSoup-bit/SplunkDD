[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = endpoint
# renderXml is required, not cosmetic: the Splunk Add-on for Sysmon keys on the
# sourcetype XmlWinEventLog:Microsoft-Windows-Sysmon/Operational. Without this the
# events land as classic WinEventLog:... , the add-on never matches them, and every
# CIM field (process_name, parent_process_name, CommandLine, user) comes back empty.
renderXml = true

